name: Vitalgen
description: 'Shanghai Vitalgen BioPharma Co., Ltd. (Vitalgen), founded in March 2020 and headquartered
  in Shanghai, China, translates cutting-edge gene delivery and gene editing techniques into clinically
  effective treatments for patients with unmet medical needs. Vitalgen operates a GMP-compliant commercial
  production platform built on its proprietary ViCas CRISPR/Cas editing tools, ViLNP lipid nanoparticles,
  and ViVec AAV capsids, developing gene therapies for hereditary diseases and neurodegenerative disorders
  across a pipeline that includes Bietti Crystalline Dystrophy (VGR-R01), AADC Deficiency, Parkinson''s
  Disease, Gaucher Disease, and Glutaric Acidemia Type I. Several candidates have entered clinical trials
  and secured U.S. FDA Orphan Drug Designations and an EMA PRIME designation. Surfaced as a portfolio
  company of IDG Capital and added to the API Evangelist network. The company publishes a corporate
  marketing website only and exposes no public API, developer portal, or machine-readable surface.'
